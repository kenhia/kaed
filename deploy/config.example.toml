# kaed configuration — copy to ~/.config/kaed/config.toml and edit.
#
# deploy/install.sh will place this file for you if none exists, but it will
# never overwrite one. The roots below are placeholders and WILL NOT WORK
# unchanged: kaed refuses to start on a root that does not exist.
#
# Validate whatever you write with `kaed check-config`, and read the deny
# list it prints. That is the real one, not the one you think you wrote.

[server]
bind = "127.0.0.1:4870"

# This instance's name in the fleet, and the prefix on every root name it
# serves: root `src` is addressed as `kai:src`. Defaults to the short system
# hostname, which is almost always what you want — set it only if this host
# is known to the fleet by some other name. kaed logs the name it resolved
# and refuses to start if it cannot find one.
# host = "kai"

# Host header values accepted beyond loopback. The MCP layer validates
# `Host` as a DNS-rebinding guard, BEFORE auth runs — so behind a proxy an
# unlisted hostname gives you a 4xx that looks nothing like an auth problem.
# List the external name in BOTH forms, bare and with the port.
allowed_hosts = [
    # "myhost.example.ts.net",
    # "myhost.example.ts.net:4870",
]

# ---------------------------------------------------------------- roots
#
# The only paths kaed can reach. This is the entire security boundary, and
# the one thing to get right.
#
# DO NOT ROOT AT $HOME. kaed's first deployment did, and `read` on
# ~/.config/kaed/env returned the very bearer token gating the service.
# Name the directories holding work you actually want an agent editing.

# Declare the LOCAL name only. kaed prefixes it with `host`, so `src` below
# is served — and journaled — as `kai:src`.

[[roots]]
name = "src"
path = "~/src"
description = "code repos"

[[roots]]
name = "scratch"
path = "~/scratch"
description = "scratch space"

# ---------------------------------------------------------------- peers
#
# The declared fleet: every OTHER host that should — or deliberately should
# not — run kaed. Surfaced in the `roots` response, which is the one place
# an agent already looks, and reported by `kaed check-config` for whoever
# has a shell instead of an MCP client.
#
# Why here and not in a repo file: config.toml is *installed*, not cloned.
# It is present on hosts with no checkout, it survives reinstalls, and it is
# not a gitignored file that ends up living nowhere.
#
# LEAVE THE TABLE OUT ENTIRELY and kaed reports `fleet.declared: false` —
# an honest "this host claims nothing", so a missing entry proves nothing.
# Write it, and every absence becomes meaningful. That is the point:
#
#   status = "active"       should be serving. (Not verified until peer
#                           mode — kaed does not probe peers yet.)
#   status = "deferred"     deliberately WITHOUT an instance. Requires
#                           `ref`. This is the entry that stops an agent
#                           reading a decision as a broken rollout and
#                           "fixing" it.
#   status = "unreachable"  should be serving and is known not to be.
#                           Requires `since`.
#
# [peers.otherhost]
# status = "active"
# url    = "https://otherhost.example.ts.net:4870/mcp"
#
# [peers.dbhost]
# status = "deferred"
# ref    = "korg:929"
# note   = "broad-access design not settled; sits next to the datastore"

# ----------------------------------------------------------------- auth
#
# One entry per agent identity; the name is recorded on every journal
# entry. Use `token_file`, not `token_env`: a process cannot re-read its own
# systemd EnvironmentFile, so an env token cannot be rotated without a
# restart that kills live sessions.
#
# Generate the token with `deploy/new-token.sh` — never by hand, and never
# somewhere it gets printed.

[auth]
claude = { token_file = "~/.config/kaed/token" }

# During a rotation, `deploy/new-token.sh --rotate` writes the old value to
# token.prev and it keeps working until you close the window. Uncomment to
# enable the grace window:
# claude = { token_file = "~/.config/kaed/token", prev_token_file = "~/.config/kaed/token.prev" }

[limits]
max_read_bytes = 262144       # per-response byte budget
max_file_bytes = 8388608      # refuse to read/edit files larger than this
search_max_results = 50       # default cap on search hits

[journal]
# Days of blob *content* retained. Transaction metadata is kept forever.
retention_days = 7

# ------------------------------------------------------------- security
#
# Two lists with different teeth (sprint 008):
#
#   deny     — hard refusal. Built-in defaults cover credential *stores*
#              (.ssh, .gnupg, .aws, .netrc, …) plus kaed's own config and
#              journal directories unconditionally.
#   classify — served REDACTED instead of refused. Built-in defaults cover
#              secret-bearing *files* (.env, *.env, *.pem, id_*,
#              credentials*, *.kdbx). Dotenv-shaped classified files get a
#              redacted read (values become ⟨kaed:KEY@digest⟩ placeholders)
#              and typed env ops; other classified files refuse with a
#              structured reason. Heuristics classify; only explicit deny
#              entries hard-refuse.
#
# A path matches either list if it or any ancestor matches. There is also a
# third, in-repo layer: a gitignore-shaped `.kaedignore` at any level of a
# root denies paths beneath it (readable through kaed, never writable).
#
# These deny entries are not built-in defaults but have earned their place
# on every host this project runs on: a directory literally named
# `secrets`, and private key material that does not happen to end in `.pem`.
#
# Write `**/secrets`, NOT `**/secrets/**`. A path is denied if it or any
# ancestor matches, so the bare form covers the directory *and* everything
# under it. The `/**` form matches only what is inside, leaving the
# directory itself listable and stat-able — which was true on kai until
# sprint 004 noticed.
[security]
deny = [
    "**/secrets",
    "**/*.key",
]
# classify = ["**/service.conf"]   # extra redaction targets, same shapes
# use_default_classify = true      # the built-in classify list above

# The secret lifecycle (011). `secret` / generate accepts either a raw spec
# from the closed grammar — hex(N), base64url(N), uuid4, prefixed(tag,inner)
# — or a name declared here. Specs are validated at startup.
# [secrets]
# allow_reveal = true              # false refuses secret_reveal host-wide
# leak_checks = "refuse"           # write-side leak detection (012):
#                                  # "refuse" (default) — known-digest /
#                                  # provider-prefix / private-key matches
#                                  # refuse with a named allow_secrets
#                                  # override, the entropy heuristic warns;
#                                  # "flag" — everything warns; "off"
# [secrets.shapes]
# klams = "prefixed(klams-,hex(64))"

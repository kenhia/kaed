[package]
name = "kaed"
version = "0.1.0"
edition = "2024"
description = "An editor whose only user is an AI agent: an MCP server for verified, transactional, journaled file edits over HTTP."
authors = ["Ken Hiatt"]
license = "MIT"
repository = "https://github.com/kenhia/kaed"
readme = "README.md"
keywords = ["mcp", "agent", "editor", "llm", "ai"]
categories = ["development-tools", "text-editors"]
# Not published to crates.io: kaed is a daemon you deploy, and its version
# numbers track sprints rather than a public API.
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.5"
clap = { version = "4.6.5", features = ["derive"] }
globset = "0.4.19"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
http = "1.5.0"
humantime = "2.4.0"
ignore = "0.4.31"
rmcp = { version = "3.1.0", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }
toml = "1.1.4"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rmcp = { version = "3.1.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
tokio-util = "0.7.19"
